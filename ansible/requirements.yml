roles:
  - src: https://github.com/cycloidio/ansible-concourse
    name: cycloid.concourse
    version: master
    scm: git

  - src: https://github.com/cycloidio/ansible-systemd
    version: master
    name: cycloid.systemd
    scm: git

  - src: https://github.com/nickhammond/ansible-logrotate
    version: master
    name: nickhammond.ansible-logrotate
    scm: git

    #- src: https://github.com/transferwise/ansible-ebs-automatic-nvme-mapping
  - src: https://github.com/cycloidio/ansible-ebs-automatic-nvme-mapping
    version: master
    name: cycloid.ebs-automatic-nvme-mapping
    scm: git

collections:
  # Install a collection from Ansible Galaxy.
  # - name: community.docker
  - source: https://github.com/ansible-collections/community.docker
    type: git
    # latest tag, can be updated
    version: 5.0.4
    source: https://galaxy.ansible.com

  # opensource collection for prometheus
  # https://github.com/prometheus-community/ansible
  # - name: prometheus.prometheus
  - source: https://github.com/prometheus-community/ansible
    type: git
    version: "0.27.3"
    source: https://galaxy.ansible.com
